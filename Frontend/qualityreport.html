<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Quality Report</title>

    <link rel="stylesheet" href="qualityreport.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <header class="top-bar">

        <div class="logo">

            <i class="fa-solid fa-chart-column"></i>

            <span>Junior Data Analyst AI</span>

        </div>

        <div class="page-title">

            <h1>Data Quality Report</h1>

            <p>Analyze missing values, empty strings and duplicate rows.</p>

        </div>

    </header>



    <main class="dashboard">

        <div id="error-message"></div>

        <div id="quality-container">

            <!-- Generated by JavaScript -->

        </div>

    </main>



    <template id="file-template">

        <div class="quality-card">

            <div class="card-header">

                <div class="file-info">

                    <div class="file-icon">

                        <i class="fa-solid fa-file-lines"></i>

                    </div>

                    <div>

                        <h2 class="file-name"></h2>

                        <span class="file-subtitle">
                            Dataset Quality Report
                        </span>

                    </div>

                </div>

                <div class="status-badge">

                    <i class="fa-solid fa-circle-check"></i>

                    Checked

                </div>

            </div>



            <div class="summary">

                <div class="summary-card red">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <h3 class="missing-total">0</h3>

                    <span>Missing Values</span>

                </div>

                <div class="summary-card yellow">

                    <i class="fa-solid fa-font"></i>

                    <h3 class="empty-total">0</h3>

                    <span>Empty Strings</span>

                </div>

                <div class="summary-card blue">

                    <i class="fa-solid fa-copy"></i>

                    <h3 class="duplicate-total">0</h3>

                    <span>Duplicate Rows</span>

                </div>

            </div>



            <div class="section">

                <div class="section-title">

                    <i class="fa-solid fa-circle-exclamation"></i>

                    Missing Values<span class="s">(empty cell,NaN,nan,None,N/A)</span>

                </div>

                <div class="table-area missing-table"></div>

            </div>



            <div class="section">

                <div class="section-title">

                    <i class="fa-solid fa-align-left"></i>

                    Empty Strings <span class="s">('' ,'    ')</span>

                </div>

                <div class="table-area empty-table"></div>

            </div>

        </div>

    </template>

    <script src="qualityreport.js"></script>

</body>

</html>
